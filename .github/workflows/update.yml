name: update

# Daily server-side refresh of the dentists' Google review counts (no computer needed).
# fetch.mjs both re-queries tracked practices and auto-discovers new GP dentists in town.
# Needs ONE of these repo secrets (fetch.mjs prefers Places if both are set):
#   SERPAPI_KEY            — SerpApi free plan (serpapi.com, no credit card; ~1 search/day)
#   GOOGLE_PLACES_API_KEY  — Google Places API (needs a GCP project with billing)
# With neither secret, fetch.mjs exits cleanly and nothing changes (record.mjs manually).
on:
  schedule:
    - cron: '37 14 * * *'    # ~07:37 PT — morning snapshot
    - cron: '37 2 * * *'     # ~19:37 PT — evening snapshot catches same-day reviews
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh review counts
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node fetch.mjs
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json
            git commit -m "update: dentist review counts $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no change (or no API key configured)"
          fi
